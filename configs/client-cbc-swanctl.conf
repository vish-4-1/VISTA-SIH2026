connections {
    vista-cbc {
        version = 2
        # IKE proposal: AES-256-CBC with HMAC-SHA-256 authentication
        proposals = aes256-sha256-modp2048

        local_addrs  = 172.20.0.2
        remote_addrs = 172.20.0.10

        local {
            auth = psk
            id   = vista-client
        }

        remote {
            auth = psk
            id   = vista-gateway
        }

        children {
            vista-cbc-child {
                local_ts  = 172.20.0.2/32
                remote_ts = 172.20.0.10/32
                mode      = transport

                # ESP: AES-256-CBC with HMAC-SHA-256 integrity (separate auth, no AEAD)
                # This configuration is weaker than AES-GCM because CBC mode is not
                # authenticated encryption — it requires a separate HMAC step.
                esp_proposals = aes256-sha256-modp2048

                start_action = start
                close_action = trap
            }
        }
    }
}

secrets {
    ike-vista {
        id-1   = vista-client
        id-2   = vista-gateway
        secret = "VISTA-SIH-2026-PSK"
    }
}
