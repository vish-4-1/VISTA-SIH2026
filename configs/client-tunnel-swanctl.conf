connections {
    vista-tunnel {
        version = 2
        # IKE proposal: AES-256-CBC with HMAC-SHA-256 and MODP-2048 DH
        proposals = aes256-sha256-modp2048

        local_addrs  = 172.20.0.2
        remote_addrs = 172.20.0.10

        local {
            auth = psk
            id   = vista-client
        }

        remote {
            auth = psk
            id   = vista-gateway
        }

        children {
            vista-child {
                # Tunnel mode protects the 10.0.1.x client subnet toward the 172.22.x.x server subnet.
                local_ts  = 10.0.1.0/24
                remote_ts = 172.22.0.0/24
                mode      = tunnel

                # ESP proposal: AES-256-GCM (AEAD) with MODP-2048 for PFS rekeying
                esp_proposals = aes256gcm128-modp2048

                start_action = start
                close_action = trap
            }
        }
    }
}

secrets {
    ike-vista {
        id-1   = vista-client
        id-2   = vista-gateway
        secret = "VISTA-SIH-2026-PSK"
    }
}
