connections {
    vista-tunnel {
        version = 2
        proposals = aes256-sha256-modp2048

        local_addrs  = 172.20.0.10
        remote_addrs = 172.20.0.2

        local {
            auth = psk
            id   = vista-gateway
        }

        remote {
            auth = psk
            id   = vista-client
        }

        children {
            vista-child {
                # Respond to tunnel-mode SA requests from the client subnet.
                local_ts  = 172.22.0.0/24
                remote_ts = 10.0.1.0/24
                mode      = tunnel

                esp_proposals = aes256gcm128-modp2048

                start_action = trap
                close_action = trap
            }
        }
    }
}

secrets {
    ike-vista {
        id-1   = vista-gateway
        id-2   = vista-client
        secret = "VISTA-SIH-2026-PSK"
    }
}
