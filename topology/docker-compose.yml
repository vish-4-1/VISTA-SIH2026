version: "3.8"

# ============================================================================
# VISTA Direct PC1-to-PC2 IPsec Testbed — Docker Compose
# SIH26160 · NTRO · Smart India Hackathon 2026
#
# Topology:
#
#   pc1 (172.20.0.2) <===== ONE DIRECT IPsec TUNNEL =====> pc2 (172.20.0.3)
#
# No gateway, server, router, or intermediate proxy.
# ============================================================================

networks:
  vista-net:
    name: vista-pc-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

services:

  # --------------------------------------------------------------------------
  # PC1 — Workstation / IPsec Endpoint 1
  # Initiates the direct IKEv2 / IPsec tunnel toward PC2.
  # --------------------------------------------------------------------------
  pc1:
    container_name: pc1
    build:
      context: ./strongswan
      dockerfile: Dockerfile
    cap_add:
      - NET_ADMIN
    environment:
      VISTA_INITIATE: "1"
      VISTA_CHILD: "pc-tunnel"
    networks:
      vista-net:
        ipv4_address: 172.20.0.2
    volumes:
      - ../configs/pc1-swanctl.conf:/etc/swanctl/swanctl.conf:ro
    depends_on:
      pc2:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # PC2 — Workstation / IPsec Endpoint 2
  # Responds to IKEv2 from PC1 and establishes the direct tunnel.
  # --------------------------------------------------------------------------
  pc2:
    container_name: pc2
    build:
      context: ./strongswan
      dockerfile: Dockerfile
    cap_add:
      - NET_ADMIN
    environment:
      VISTA_INITIATE: "0"
    networks:
      vista-net:
        ipv4_address: 172.20.0.3
    volumes:
      - ../configs/pc2-swanctl.conf:/etc/swanctl/swanctl.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "swanctl --list-conns | grep -q 'pc1-pc2'"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # eBPF HOST MONITOR — libbpf loads a CO-RE object compiled against runtime BTF.
  # Observes host/WSL2 kernel XFRM/socket probes; not an IPsec endpoint.
  # --------------------------------------------------------------------------
  vista-ebpf-monitor:
    container_name: vista-ebpf-monitor
    profiles: ["ebpf"]
    build:
      context: ../ebpf
      dockerfile: Dockerfile
    cap_add:
      - BPF
      - PERFMON
    ulimits:
      memlock:
        soft: -1
        hard: -1
    read_only: true
    tmpfs:
      - /run/vista:rw,noexec,nosuid,size=64m
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "127.0.0.1:8765:8765"
    restart: unless-stopped
