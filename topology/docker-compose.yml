version: "3.8"

# ============================================================================
# VISTA IPsec Testbed — Docker Compose
# SIH26160 · NTRO · Smart India Hackathon 2026
#
# Network topology:
#
#   vista-client (172.20.0.2) ── vista-net ── vista-gateway (172.20.0.10)
#                                                     │
#                                               vista-internal
#                                                     │
#                                          vista-server (172.22.0.10)
#
# Container naming must match the ML pipeline scripts in vista-ml/scripts/.
# ============================================================================

networks:
  vista-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

  vista-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24

services:

  # --------------------------------------------------------------------------
  # INITIATOR — IKEv2 client / workstation
  # Starts the IKE_SA_INIT exchange toward vista-gateway.
  # NET_ADMIN is required for the Linux IPsec XFRM kernel subsystem.
  # --------------------------------------------------------------------------
  vista-client:
    container_name: vista-client
    image: strongswan/strongswan:latest
    cap_add:
      - NET_ADMIN
    networks:
      vista-net:
        ipv4_address: 172.20.0.2
    volumes:
      - ../configs/client-swanctl.conf:/etc/swanctl/swanctl.conf:ro
    restart: unless-stopped
    # charon (not charon-systemd) is the correct daemon for non-systemd containers.
    command: ["charon"]

  # --------------------------------------------------------------------------
  # GATEWAY — IKEv2 responder / security gateway
  # Terminates the IPsec tunnel and routes decrypted traffic to vista-server.
  # Attached to both networks so it can forward between them.
  # --------------------------------------------------------------------------
  vista-gateway:
    container_name: vista-gateway
    image: strongswan/strongswan:latest
    cap_add:
      - NET_ADMIN
    networks:
      vista-net:
        ipv4_address: 172.20.0.10
      vista-internal:
        ipv4_address: 172.22.0.2
    volumes:
      - ../configs/gateway-swanctl.conf:/etc/swanctl/swanctl.conf:ro
    restart: unless-stopped
    command: ["charon"]

  # --------------------------------------------------------------------------
  # SERVER — Protected resource behind the gateway
  # Listens for test traffic forwarded by vista-gateway after IPsec decryption.
  # Exposes a simple HTTP server and a netcat listener for the ML test scripts.
  # --------------------------------------------------------------------------
  vista-server:
    container_name: vista-server
    image: python:3.11-slim
    networks:
      vista-internal:
        ipv4_address: 172.22.0.10
    command: >
      sh -c "apt-get update -qq &&
             apt-get install -y -qq netcat-openbsd &&
             python3 -m http.server 18080"
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # eBPF HOST MONITOR — Privileged kernel-space telemetry collector
  # Runs on the host kernel PID namespace and monitors cgroup events for
  # both IPsec containers.  This currently uses Tetragon as a placeholder;
  # replace with the custom VISTA eBPF agent when implemented.
  #
  # NOTE: This container requires a Linux host with eBPF support.
  # It will fail gracefully on Windows/macOS Docker Desktop (no host kernel).
  # --------------------------------------------------------------------------
  vista-ebpf-monitor:
    container_name: vista-ebpf-monitor
    image: cilium/tetragon:latest
    pid: host
    network_mode: host
    privileged: true
    cap_add:
      - CAP_BPF
      - CAP_PERFMON
      - CAP_NET_ADMIN
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/fs/bpf:/sys/fs/bpf
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - vista-client
      - vista-gateway
