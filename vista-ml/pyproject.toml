[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vista-ml"
version = "0.1.0"
description = "VISTA ML: AI-Powered IPsec VPN Protocol Analyzer and Security Assessment Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.1.0",
    "shap>=0.46.0",
    "pyarrow>=15.0.0",
    "joblib>=1.4.0",
    "matplotlib>=3.8.0",
    "PyYAML>=6.0",
    "scapy>=2.5.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["src"]
